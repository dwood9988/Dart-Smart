<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f3322">
<title>Dart Smart</title>
<link rel="apple-touch-icon" href="icon-v2.png">
<link rel="icon" type="image/png" href="icon-v2.png">
<meta name="apple-mobile-web-app-title" content="Dart Smart">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Bevan&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1c5b3c; --felt3:#0f3322;
  --wood:#8b6b45; --wood-dk:#4e3724; --wood-lt:#b58d5c;
  --paper:#f6edd6; --paper2:#e8dcbc; --ink:#2b1d12; --ink2:#6a5846;
  --burg:#7a1d2c; --burg2:#92283a; --burg-dk:#4a0f19;
  --gold:#f0c24a; --cream:#f6edd6; --dim:#bfd3c1;
  --good:#1d6b43; --bad:#a3261f;
  --body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --num:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --disp:"Bevan","Rockwell","Georgia",serif;
  --hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--felt3);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cream);--m:var(--dim);font:17px/1.4 var(--body);
  background:
    radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.4px) 0 0/4px 4px repeat,
    radial-gradient(ellipse 120% 70% at 50% 6%,#2b7d54 0%,var(--felt) 45%,var(--felt3) 100%) 0 0/100% 100% no-repeat,
    var(--felt3);}
.app{max-width:520px;margin:0 auto;padding:14px 14px 48px}
p{margin:0 0 10px}
.muted{color:var(--m)}
.sm{font-size:14px}
.center{text-align:center}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card button:focus-visible,.card input:focus-visible,.card summary:focus-visible{outline-color:var(--burg)}

/* home */
.logo{width:min(80vw,300px);margin:4px auto 0}
.logo svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.brand{font:400 46px/1 var(--disp);text-align:center;margin:8px 0 2px;color:var(--cream);text-shadow:0 2px 0 var(--felt3),0 5px 12px rgba(0,0,0,.4)}
.tagline{font:600 30px/1.1 var(--hand);color:var(--gold);text-align:center;margin:0 0 18px}
.gametile{position:relative;display:block;width:100%;text-align:left;margin:0 0 14px;padding:12px 56px 12px 18px;
  background:linear-gradient(180deg,var(--burg2),var(--burg));border:3px solid var(--wood);border-radius:12px;color:var(--cream);
  box-shadow:0 4px 0 var(--wood-dk),0 10px 16px rgba(0,0,0,.35)}
.gametile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wood-dk),0 6px 10px rgba(0,0,0,.35)}
.gametile::after{content:"\203A";position:absolute;right:18px;top:50%;transform:translateY(-52%);font:700 44px var(--num);color:var(--gold)}
.gt-n{display:block;font:700 56px/1 var(--num);color:var(--gold)}
.gt-d{display:block;font-size:15px;opacity:.92;margin-top:2px}

/* cards */
.card{background:var(--paper);color:var(--ink);--m:var(--ink2);border:3px solid var(--wood);border-radius:12px;padding:14px;margin:12px 0;
  box-shadow:0 4px 0 var(--wood-dk),0 10px 16px rgba(0,0,0,.35)}
details.card summary{cursor:pointer;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";float:right;font:700 26px/1 var(--num)}
details.card[open] summary::after{content:"\2212"}
details.card p{margin:10px 0 0}
.lbl{font-weight:600;margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:46px;border:2px solid var(--wood-lt);background:var(--paper2);color:var(--ink);border-radius:8px;font:700 19px var(--num);letter-spacing:.3px;padding:0 4px}
.seg button.on{background:var(--burg);border-color:var(--burg-dk);color:var(--cream)}
.names{display:flex;gap:8px}
.names input{flex:1;min-width:0;font:600 18px var(--body);border:2px solid var(--wood);border-radius:8px;background:#fffaf0;color:var(--ink);padding:8px 10px;min-height:46px}
.primary{background:linear-gradient(180deg,var(--burg2),var(--burg));color:var(--cream);border:2px solid var(--wood-dk);border-radius:8px;min-height:48px;padding:0 20px;font:700 22px var(--num);letter-spacing:.3px;box-shadow:0 2px 0 var(--wood-dk)}
.primary:active{transform:translateY(1px)}
.primary.wide{width:100%;margin-top:12px}
.ghost{background:rgba(0,0,0,.22);border:1px solid var(--wood-lt);border-radius:8px;min-height:40px;padding:0 12px;font-size:15px;color:var(--cream)}
.card .ghost{background:transparent;border-color:var(--wood);color:var(--ink)}

/* game screen */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{font:400 28px var(--disp);color:var(--cream)}
.rules{text-align:center;color:var(--dim);font-size:14px;margin-top:2px}
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:8px 0 6px}
.pl{padding:4px 8px;border:2px solid transparent;border-radius:8px;min-width:0}
.hud.two .pl{flex:1}
.pl.on{border-color:var(--gold);background:rgba(0,0,0,.22)}
.pn{font:600 16px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font:700 64px/0.95 var(--num)}
.hud.two .big{font-size:54px}
.tag{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 6px}
.mini{display:flex;gap:16px}
.mini div{text-align:right}
.mini b{display:block;font:700 26px/1 var(--num)}
.mini span{font-size:13px;color:var(--dim)}
.turn{text-align:center;font:700 24px var(--num);color:var(--gold);margin:4px 0 0}
.boardbox{width:100%;max-width:340px;margin:6px auto 0}
.boardbox svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.dart{transform-box:fill-box;transform-origin:center;animation:land .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes land{from{opacity:0;transform:scale(3.2)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--dim);margin:8px 0 4px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--paper);color:var(--ink);border:1px solid var(--wood-lt);border-left:5px solid var(--ink2);border-radius:8px;padding:5px 12px 5px 8px;font:700 24px/1.1 var(--num);animation:fade .3s both;display:flex;align-items:center;gap:8px}
.chip i{font:600 13px var(--body);font-style:normal;color:var(--ink2)}
.c-t{border-left-color:#c8312b}.c-d{border-left-color:#1f9a62}.c-s{border-left-color:#8d99a3}
.c-bull,.c-outer{border-left-color:#e0a81a}.c-miss{border-left-color:transparent;color:var(--ink2)}
.chipnote{width:100%;text-align:center;font-size:14px;color:var(--dim)}
.q{font-weight:500;font-size:18px}
.row{display:flex;gap:8px;margin:8px 0}
.row input{flex:1;min-width:0;font:700 34px var(--num);text-align:center;border:2px solid var(--wood);border-radius:8px;background:#fffaf0;color:var(--ink);padding:2px 10px;min-height:54px}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fb{margin:6px 0;font-weight:600}
.fb.no{color:var(--bad)}
.note{font-weight:600;margin-bottom:8px}
.note.ok{color:var(--good)}
.hint{background:var(--paper2);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:16px}
.res{font:600 22px/1.3 var(--body);margin:2px 0 10px}
.res b{font:700 34px var(--num)}
.res.win{color:var(--good)}
.res.bust{color:var(--bad)}
.lines{font-size:16px;margin:0 0 10px;padding:0;list-style:none}
.lines li{padding:3px 0;border-bottom:1px solid #d8caa6}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.tile{background:var(--paper2);border-radius:8px;padding:6px 2px;text-align:center;border:2px solid transparent}
.tile.bad{border-color:var(--bad)}
.tnum{font:700 20px/1 var(--num)}
.tg{font-size:22px;height:30px;line-height:30px}
.topp{font-size:11px;color:var(--ink2);height:14px;font-weight:600;white-space:nowrap}
.topp.cl{color:var(--bad)}
.tile button{width:100%;height:40px;border:2px solid var(--wood-lt);border-radius:6px;background:var(--paper);color:var(--ink);font:700 22px var(--num);padding:0}
.tadd{font:700 26px/1.5 var(--num)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.statrow b{display:block;font:700 34px/1.1 var(--num)}
.statrow span{font-size:13px;color:var(--ink2)}
.earns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.earn{background:var(--paper2);color:var(--good);font-weight:600;font-size:14px;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px}
.bank{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:64px;font:700 26px var(--num);color:var(--gold)}
.howbtn{display:block;width:100%;margin:0 0 14px;padding:12px 18px;background:var(--paper);color:var(--ink);border:3px solid var(--wood);border-radius:12px;font:700 26px/1.1 var(--num);letter-spacing:.3px;text-align:center;box-shadow:0 4px 0 var(--wood-dk),0 10px 16px rgba(0,0,0,.35)}
.howbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wood-dk),0 6px 10px rgba(0,0,0,.35)}
.how h3{font:700 24px/1.1 var(--num);margin:16px 0 4px;color:var(--burg)}
.how p,.how li{font-size:16px}
.how ul,.how ol{margin:0 0 6px;padding-left:20px}
.how li{margin:3px 0}
.btnrow{display:flex;gap:12px;margin:0 0 14px}
.btnrow .howbtn{margin:0;flex:1;width:auto}
.howbtn small{display:block;font:600 13px var(--body);letter-spacing:0;color:var(--ink2);margin-top:3px}
.howbtn.ready{border-color:var(--gold)}
.howbtn.ready small{color:var(--burg)}
.primary:disabled{opacity:.5;cursor:default}
.tbig{width:min(100%,300px);margin:8px auto}
.tbig svg{display:block;width:100%;height:auto;border-radius:10px;border:3px solid var(--wood)}
.glow svg{box-shadow:0 0 22px rgba(240,194,74,.75)}
.done-title{font:400 28px var(--disp);color:var(--burg)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcase{text-align:center;font-size:13px;font-weight:600;line-height:1.2}
.tcase svg{display:block;width:100%;height:auto;border-radius:8px;border:2px solid var(--wood);margin-bottom:4px}
.tcase small{display:block;font-weight:400;color:var(--ink2)}
.peel{transform-box:fill-box;transform-origin:center;animation:peel .9s ease-out forwards}
@keyframes peel{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.85)}}
.chalktile{position:relative;display:block;width:100%;text-align:left;margin:0 0 14px;padding:12px 18px 14px;background:#1f3a34;color:#f3f1e8;border:6px solid var(--wood);border-radius:10px;
  box-shadow:inset 0 0 28px rgba(0,0,0,.5),0 4px 0 var(--wood-dk),0 10px 16px rgba(0,0,0,.35)}
.chalktile:active{transform:translateY(2px)}
.ct-t{display:block;font:600 44px/1 var(--hand)}
.ct-d{display:block;font:600 22px/1.1 var(--hand);color:var(--gold);margin-top:2px}
.chalkboard{position:relative;background:#1f3a34;color:#f3f1e8;border:10px solid var(--wood);border-radius:8px;padding:16px 16px 20px;margin:14px 0 34px;font:700 30px/1.25 var(--hand);
  text-shadow:0 0 1px rgba(255,255,255,.55);box-shadow:inset 0 0 44px rgba(0,0,0,.5),0 4px 0 var(--wood-dk),0 10px 16px rgba(0,0,0,.35)}
.chalkboard::after{content:"";position:absolute;left:-12px;right:-12px;bottom:-26px;height:16px;background:var(--wood-lt);border:2px solid var(--wood-dk);border-radius:4px;box-shadow:0 4px 8px rgba(0,0,0,.35)}
.chalkboard::before{content:"";position:absolute;left:26px;bottom:-22px;width:38px;height:9px;border-radius:5px;background:#f3f1e8;box-shadow:50px 0 0 var(--gold);z-index:2}
.cl{margin:5px 0;opacity:0;animation:chalk .55s ease-out forwards}
.chalkboard.still .cl{animation:none;opacity:1}
@keyframes chalk{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ch-title{font:700 44px/1.05 var(--hand);color:var(--gold);margin-bottom:8px}
.cy{color:var(--gold)}
.cd{font-size:25px;opacity:.9}
.ch-big{font:700 96px/1 var(--num);text-align:center;margin:4px 0;text-shadow:none;letter-spacing:1px}
.chalkboard.big{padding:20px 18px 24px}
.chalkboard.big .ch-title{font-size:54px}
.lessonbtn{display:block;width:100%;text-align:left;margin:0 0 12px;padding:12px 14px;background:var(--paper);color:var(--ink);border:3px solid var(--wood);border-radius:12px;box-shadow:0 3px 0 var(--wood-dk)}
.lessonbtn b{display:block;font:700 24px/1.1 var(--num)}
.lessonbtn small{display:block;font-size:14px;color:var(--ink2)}
.lessonbtn .stamp{float:right;font-size:30px;line-height:1;color:#c98f12}
.lessonbtn.soon{opacity:.55;cursor:default}
.lnav{display:flex;gap:10px;margin-top:4px}
.lnav .primary{flex:1;margin:0}
.lnav .ghost{min-height:48px}
.altbtn{width:100%;margin:0 0 10px;min-height:46px;font-size:17px}
.chalkboard.xl{font-size:36px}
.chalkboard.xl .cd{font-size:30px}
.chalkboard.xl .ch-title{font-size:50px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:6px 12px;margin:4px 0 8px}
.wgrid span{white-space:nowrap}
.op{font-style:normal;font-size:.68em;color:var(--gold)}
.tcase svg.starsvg{border:0;border-radius:0}
@media (prefers-reduced-motion:reduce){.dart,.chip,.peel,.cl{animation:none}.peel{opacity:0}.cl{opacity:1}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var SEG=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
var CR=[20,19,18,17,16,15,25];
var GL=['–','/','✕','⊗'];
var SIG={easy:10,medium:19,hard:29};
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var nm=function(n){return n===25?'Bull':String(n);};

var S={mode:'501',diff:'medium',start:501,players:1,dIn:false,dOut:true,names:['Player 1','Player 2']};
try{var saved=JSON.parse(localStorage.getItem('dmt2')||'null');if(saved){S=Object.assign(S,saved);}}catch(e){}
if(!Array.isArray(S.names)||S.names.length<2)S.names=['Player 1','Player 2'];
S.view='home';
function saveS(){try{var c=Object.assign({},S);delete c.view;localStorage.setItem('dmt2',JSON.stringify(c));}catch(e){}}
var G=null;

/* ---------- rewards (saved on this phone only) ---------- */
var R={bulls:0,bestStreak:0,bestAcc:0,games:0,days:[],streak:0,bestDays:0,last:'',tIdx:0,tPieces:[],tDone:[],lessons:[]};
try{var sr=JSON.parse(localStorage.getItem('dmt_rewards')||'null');if(sr){R=Object.assign(R,sr);}}catch(e){}
if(!Array.isArray(R.days))R.days=[];
if(!Array.isArray(R.tPieces))R.tPieces=[];
if(!Array.isArray(R.tDone))R.tDone=[];
if(!Array.isArray(R.lessons))R.lessons=[];
function saveR(){try{localStorage.setItem('dmt_rewards',JSON.stringify(R));}catch(e){}}
function dstr(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dnum(s){var a=s.split('-');return Math.round(Date.UTC(+a[0],+a[1]-1,+a[2])/86400000);}
function bullSVG(n){return '<svg width="'+n+'" height="'+n+'" viewBox="0 0 20 20" aria-hidden="true" style="vertical-align:-3px"><circle cx="10" cy="10" r="9.5" fill="#c8312b"/><circle cx="10" cy="10" r="6.5" fill="#f1e6c4"/><circle cx="10" cy="10" r="3.4" fill="#c8312b"/></svg>';}
function liveStreak(){
  if(!R.last)return 0;
  return dnum(dstr(new Date()))-dnum(R.last)>2?0:R.streak;
}
function touchToday(){
  var t=dstr(new Date());
  if(R.last===t)return;
  var gap=R.last?dnum(t)-dnum(R.last):99;
  if(!R.last){R.streak=1;G.msgs.push('Day 1 streak started');}
  else if(gap<=2){R.streak++;G.msgs.push('Day '+R.streak+' streak'+(gap===2?', one day off is fine':''));}
  else{R.streak=1;G.msgs.push('Welcome back! Fresh streak started');}
  R.bestDays=Math.max(R.bestDays,R.streak);
  R.days.push(t);if(R.days.length>60)R.days=R.days.slice(-60);
  R.last=t;saveR();
}
function earn(n){R.bulls+=n;G.turnEarn+=n;G.gameEarn+=n;saveR();}
function rewardAnswer(good,first,p){
  touchToday();
  if(!good)return;
  earn(first?2:1);
  if(first){
    if(p.streak>R.bestStreak){
      var had=R.bestStreak;R.bestStreak=p.streak;
      if(p.streak>=3&&had>=3)G.msgs.push('New personal best: '+p.streak+' in a row');
    }
    if(p.streak%5===0){var b=p.streak>=20?10:p.streak>=10?5:3;earn(b);G.msgs.push(p.streak+' in a row! Bonus +'+b);}
  }
  saveR();
}
function rewardGame(){
  var p=G.players[0];
  earn(5);G.msgs.push('Game finished! Bonus +5');R.games++;
  var acc=p.q?Math.round(100*p.ft/p.q):0;
  if(p.q>=10&&acc>R.bestAcc){var had=R.bestAcc;R.bestAcc=acc;if(had>0)G.msgs.push('New best accuracy: '+acc+'%');}
  saveR();
}
function earnHTML(){
  if(!G.rewards)return '';
  var h='';
  if(G.turnEarn>0)h+='<span class="earn">+'+G.turnEarn+' '+bullSVG(14)+'</span>';
  G.msgs.forEach(function(m){h+='<span class="earn">'+esc(m)+'</span>';});
  return h?'<div class="earns">'+h+'</div>':'';
}
function gameEarnHTML(){
  if(!G.rewards)return '';
  var c=TROPHIES[R.tIdx];
  return '<p class="muted">You earned '+G.gameEarn+' bullseyes this game.'+(c&&R.bulls>=c.cost?' You have enough for a trophy piece!':'')+'</p>';
}
function progressHTML(){
  if(!R.bulls&&!R.last)return '<p class="muted sm">Play a 1 player game to start collecting bullseyes.</p>';
  var t=dnum(dstr(new Date())),wk=0;
  R.days.forEach(function(d){var g=t-dnum(d);if(g>=0&&g<=6)wk++;});
  return '<div class="card"><div class="statrow"><div><b>'+bullSVG(26)+' '+R.bulls+'</b><span>bullseyes</span></div><div><b>'+liveStreak()+'</b><span>day streak</span></div><div><b>'+R.bestStreak+'</b><span>best in a row</span></div></div><p class="muted sm" style="margin:10px 0 0">Practiced '+wk+' of the last 7 days. One day off won\'t break your streak.'+(R.bestAcc?' Best accuracy: '+R.bestAcc+'%.':'')+'</p></div>';
}

/* ---------- board geometry ---------- */
function pol(r,deg){var a=deg*Math.PI/180;return [r*Math.sin(a),-r*Math.cos(a)];}
function wedge(r1,r2,a1,a2){
  var p1=pol(r2,a1),p2=pol(r2,a2),p3=pol(r1,a2),p4=pol(r1,a1);
  function f(v){return v.toFixed(2);}
  return 'M'+f(p1[0])+' '+f(p1[1])+'A'+r2+' '+r2+' 0 0 1 '+f(p2[0])+' '+f(p2[1])+'L'+f(p3[0])+' '+f(p3[1])+'A'+r1+' '+r1+' 0 0 0 '+f(p4[0])+' '+f(p4[1])+'Z';
}
function classify(x,y){
  var r=Math.hypot(x,y),o;
  if(r>170) o={kind:'miss',num:0,mult:0,value:0,label:'Miss',dbl:false};
  else if(r<=6.35) o={kind:'bull',num:25,mult:2,value:50,label:'Bull',dbl:true};
  else if(r<=15.9) o={kind:'outer',num:25,mult:1,value:25,label:'Outer bull',dbl:false};
  else{
    var ang=Math.atan2(x,-y)*180/Math.PI; if(ang<0)ang+=360;
    var n=SEG[Math.floor(((ang+9)%360)/18)];
    var mult=1; if(r>=99&&r<=107)mult=3; else if(r>=162)mult=2;
    o={kind:'seg',num:n,mult:mult,value:n*mult,label:(mult===3?'T':mult===2?'D':'S')+n,dbl:mult===2};
  }
  o.x=x;o.y=y;return o;
}

/* ---------- players ---------- */
function P(){return G.players[G.cur];}
function O(){return G.players.length===2?G.players[1-G.cur]:null;}
function oppBlocked(n){var o=O();return o?o.marks[n]>=3:G.bot.has(n);}
function oppName(){var o=O();return o?o.name:'the opponent';}
function closedAll(p){return CR.every(function(n){return p.marks[n]>=3;});}

/* ---------- throwing ---------- */
function gauss(){var u=0;while(u===0)u=Math.random();var v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function aimPoint(kind,n){
  if(n===25)return [0,0];
  var a=SEG.indexOf(n)*18,r=kind==='T'?103:kind==='D'?166:135;
  return pol(r,a);
}
function rnd20(){return 1+Math.floor(Math.random()*20);}
function aim501(running,isIn){
  var r=Math.random();
  if(!isIn){
    if(S.diff==='easy')return aimPoint('D',rnd20());
    if(S.diff==='medium'){
      if(r<.4)return aimPoint('D',20);
      if(r<.6)return aimPoint('D',16);
      if(r<.75)return aimPoint('D',10);
      if(r<.9)return [0,0];
      return aimPoint('D',rnd20());
    }
    if(r<.15)return [0,0];
    return aimPoint('D',rnd20());
  }
  if(G.rules.dOut){
    if(running<=40&&running%2===0)return aimPoint('D',running/2);
    if(running<=40)return aimPoint('S',1);
  }else{
    if(running<=20)return aimPoint('S',running);
    if(running<=40)return running%2===0?aimPoint('D',running/2):aimPoint('S',running-20);
  }
  if(running<=60)return aimPoint('S',running-40);
  if(S.diff==='easy')return aimPoint('S',rnd20());
  r=Math.random();
  if(S.diff==='medium'){
    if(r<.45)return aimPoint('T',20);
    if(r<.65)return aimPoint('T',19);
    if(r<.8)return aimPoint('T',18);
    if(r<.9)return aimPoint('T',17);
    return [0,0];
  }
  if(r<.15)return [0,0];
  return aimPoint(Math.random()<.7?'T':'D',rnd20());
}
function gen501(p){
  var darts=[],running=p.rem,isIn=p.isIn,bust=false,won=false,sig=SIG[S.diff],counted=0,dOut=G.rules.dOut;
  for(var i=0;i<3;i++){
    var t=aim501(running,isIn),h,tries=0;
    do{
      h=classify(t[0]+gauss()*sig,t[1]+gauss()*sig);tries++;
    }while(S.diff==='easy'&&isIn&&running>60&&!(h.kind==='seg'&&h.mult===1)&&tries<40);
    darts.push(h);
    if(!isIn){
      if(h.dbl){isIn=true;h.inDart=true;}
      else{h.counts=false;continue;}
    }
    h.counts=true;
    counted+=h.value;
    var nr=running-h.value;
    if(nr<0||(dOut&&(nr===1||(nr===0&&!h.dbl)))){bust=true;break;}
    running=nr;
    if(nr===0){won=true;break;}
  }
  return {darts:darts,total:counted,bust:bust,won:won,startRem:p.rem,startIn:p.isIn,
          newScore:bust?p.rem:p.rem-counted,newIn:bust?p.isIn:isIn};
}
function crMarks(h){
  if(h.kind==='bull')return [25,2];
  if(h.kind==='outer')return [25,1];
  if(h.kind==='seg'&&CR.indexOf(h.num)>=0)return [h.num,h.mult];
  return [0,0];
}
function genCricket(){
  var p=P(),sig=SIG[S.diff];
  var open=CR.filter(function(n){return p.marks[n]<3;});
  var mine=CR.filter(function(n){return p.marks[n]>=3;});
  var spare=CR.filter(function(n){return !oppBlocked(n);});
  var darts=[],exp={};CR.forEach(function(n){exp[n]=0;});
  for(var i=0;i<3;i++){
    var n,r=Math.random();
    if(open.length){
      n=open[0];
      if(open.length>1&&r<.2)n=open[1];
      else if(mine.length&&r>.7)n=mine[Math.floor(Math.random()*mine.length)];
    }else{
      var pool=spare.length?spare:CR;
      n=pool[Math.floor(Math.random()*pool.length)];
    }
    var t=aimPoint('T',n);
    var h=classify(t[0]+gauss()*sig,t[1]+gauss()*sig);
    h.cm=crMarks(h);darts.push(h);
    if(h.cm[0])exp[h.cm[0]]+=h.cm[1];
  }
  var detail=CR.map(function(n){
    var before=p.marks[n],add=exp[n],sc=Math.max(0,before+add-3)-Math.max(0,before-3),blocked=oppBlocked(n);
    return {n:n,before:before,add:add,sc:sc,blocked:blocked,pts:blocked?0:sc*n};
  });
  var points=detail.reduce(function(s,d){return s+d.pts;},0);
  return {darts:darts,exp:exp,detail:detail,points:points};
}

/* ---------- how to play ---------- */
function how501(){
  return '<div class="how">'+
  '<h3>The goal</h3><p>Start with 501 points (or 301, or 101) and count down to exactly 0.</p>'+
  '<h3>Reading the darts</h3><ul>'+
  '<li><b>S</b> is a single, the face value. S5 = 5.</li>'+
  '<li><b>D</b> is a double, twice the number. D8 = 2 × 8 = 16.</li>'+
  '<li><b>T</b> is a triple, three times the number. T20 = 3 × 20 = 60.</li>'+
  '<li>The outer bull is 25, the bull is 50, and a miss is 0.</li></ul>'+
  '<h3>Each round</h3><ol><li>Three darts land on the board.</li><li>Add them up. That is your round total.</li><li>Subtract the total from your score. That is your new score.</li></ol>'+
  '<p>Stuck? Tap Need a hint? any time. Hints are free.</p>'+
  '<h3>Double in and double out</h3><p><b>Double in:</b> your score does not start until a dart lands in a double (or the bull). Darts before that count for nothing.</p><p><b>Double out:</b> you must finish on a double (or the bull).</p>'+
  '<h3>Busts</h3><p>With double out, you bust if you go below 0, are left on 1, or reach 0 without a double. With straight out, you only bust by going below 0. A bust puts your score back to what it was at the start of the round.</p>'+
  '<h3>Winning</h3><p>Be the first to reach exactly 0. In a two-player game, the first player to check out wins.</p></div>';
}
function howCR(){
  return '<div class="how">'+
  '<h3>The goal</h3><p>Close all seven numbers: 20, 19, 18, 17, 16, 15 and the bull. A number is closed when you have 3 marks on it.</p>'+
  '<h3>Marks</h3><ul><li>A single is 1 mark, a double is 2, and a triple is 3.</li><li>The outer bull is 1 mark, and the bull is 2.</li><li>Any other number, like 12 or 7, earns nothing.</li></ul>'+
  '<h3>Scoring points</h3><p>Once you have closed a number, each extra mark on it scores that number’s value (25 for the bull), but only if your opponent has not closed it yet.</p><p>Example: you have closed 20 and hit a T20. That is 3 extra marks × 20 = 60 points.</p>'+
  '<h3>Each round</h3><ol><li>Three darts land on the board.</li><li>Tally your new marks. Each counter starts at what you already have, so tap + for every new mark.</li><li>Work out the points that round scored.</li></ol>'+
  '<h3>Winning</h3><p>On your own, close all seven numbers. With two players, close all seven while level or ahead on points. In a one-player game, the practice opponent closes a number every third round, starting with the low ones.</p></div>';
}

function ch(lines,still){

function mkQ(kind,n,hints){return {kind:kind,n:n,label:kind+n,ans:kind==='D'?2*n:3*n,hints:hints};}
function genHints(kind,n){
  if(kind==='D')return n>10?['Split it: double 10 is 20, then double '+(n-10)+'.']:['This one is on the warm-up list.'];
  var h=['Double '+n+' first, then add '+n+' one more time.'];
  if(n>=15&&n<20)h.push('Shortcut: T20 is 60. '+n+' is '+(20-n)+' below 20, so take off 3 for each step down.');
  return h;
}
function explainQ(q){
  if(q.kind==='D'){
    if(q.n<=10)return 'Double '+q.n+' is '+q.ans+'.';
    var r=q.n-10;return 'Double 10 is 20, double '+r+' is '+(2*r)+', and 20 + '+(2*r)+' = '+q.ans+'.';
  }
  return 'Double '+q.n+' is '+(2*q.n)+'. Add '+q.n+' more: '+(2*q.n)+' + '+q.n+' = '+q.ans+'.';
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickN(k){var pool=[];for(var i=11;i<=20;i++)pool.push(i);return shuffle(pool).slice(0,k);}
function startPractice(){
  C.qi=0;C.attempts=0;C.hints=0;C.fb='';C.fbc='';C.done=false;C.val='';
  if(C.step===6){
    C.qs=[mkQ('D',12,['Double 10, then double 2, then put them together.']),mkQ('D',16,['Split it into 10 and 6.']),mkQ('T',14,['Double it, then add 14 once more.']),mkQ('T',13,[])];
  }else{
    var qs=pickN(3).map(function(n){return mkQ('D',n,genHints('D',n));}).concat(pickN(3).map(function(n){return mkQ('T',n,genHints('T',n));}));
    C.qs=shuffle(qs);
  }
}
function goStep(i){
  C.step=i;C.alt=false;
  if(i===6||i===7)startPractice();
  if(i===L1_LAST&&R.lessons.indexOf('l1')<0){R.lessons.push('l1');saveR();}
  render();window.scrollTo(0,0);
}
function starsHTML(){
  return '<div class="card"><div class="lbl">Classroom stars</div><div class="shelf">'+LESSONS.map(function(l){
    var got=R.lessons.indexOf(l.id)>=0;
    return '<div class="tcase"><svg class="starsvg" viewBox="0 0 60 60" aria-hidden="true"><polygon points="'+starPts(30,32,26,11)+'" fill="'+(got?'#e6b93a':'none')+'" stroke="'+(got?'#a8790f':'#b9a98a')+'" stroke-width="2.5" stroke-linejoin="round"/></svg>'+esc(l.title)+(got?'':'<small>'+(l.soon?'coming soon':'not yet')+'</small>')+'</div>';
  }).join('')+'</div></div>';
}
function classHTML(){
  var h='<div class="top"><button class="ghost" id="back">\u2039 Back</button><div class="ttl">Classroom</div><div style="width:64px"></div></div>';
  h+='<div class="chalkboard big still"><div class="cl ch-title">Classroom</div><div class="cl cw">Pick a lesson. No timers, no grades. Take your time.</div><div class="cl cy">3 × 20 = 60</div></div>';
  h+='<p class="muted sm center">Gold stars earned: '+R.lessons.length+' of '+LESSONS.length+'. They show up on your Trophies page too.</p>';
  LESSONS.forEach(function(l){
    var done=R.lessons.indexOf(l.id)>=0;
    h+='<button class="lessonbtn'+(l.soon?' soon':'')+'" id="'+l.id+'"'+(l.soon?' disabled':'')+'>'+(done?'<span class="stamp" aria-label="Completed">★</span>':'')+'<b>'+esc(l.title)+'</b><small>'+esc(l.sub)+'</small></button>';
  });
  return h;
}
function practiceHTML(){
  var q=C.qs[C.qi],last=C.qi===C.qs.length-1;
  var h=ch([['cd','Question '+(C.qi+1)+' of '+C.qs.length],['ch-big',q.label],['cd','Say it out loud, then type the answer.']],true);
  h+='<div class="card">';
  if(!C.done){
    h+='<div class="row"><input id="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="?" aria-label="Your answer" value="'+esc(C.val)+'"><button class="primary" id="chk">Check</button></div>';
    if(C.fb)h+='<div class="fb '+C.fbc+'">'+C.fb+'</div>';
    h+='<div class="row2">';
    if(q.hints.length>C.hints)h+='<button class="ghost" id="hintbtn">'+(C.hints?'Another hint':'Need a hint?')+'</button>';
    if(C.attempts>=2)h+='<button class="ghost" id="reveal">Show answer</button>';
    h+='</div>';
    for(var i=0;i<C.hints;i++)h+='<div class="hint">'+esc(q.hints[i])+'</div>';
  }else{
    h+='<div class="res win">'+q.label+' = <b>'+q.ans+'</b></div><p>'+explainQ(q)+'</p>';
    h+='<button class="primary wide" id="qnext">'+(last?'Finish':'Next question')+'</button>';
  }
  return h+'</div>';
}
function lessonHTML(){
  var st=C.step;
  var h='<div class="top"><button class="ghost" id="back">\u2039 Back</button><div class="ttl">Lesson 1</div><button class="ghost" id="tsize" aria-label="Change text size">'+(S.big?'A\u2212':'A+')+'</button></div>';
  if(st<=5){
    var step=L1[st],lines=(C.alt&&step.alt)?step.alt:step.board;
    h+=ch(lines,false);
    if(step.alt)h+='<button class="ghost altbtn" id="alt">'+(C.alt?'Back to the first way':'Show me another way')+'</button>';
    h+='<div class="lnav">'+(st>0?'<button class="ghost" id="prev">\u2039 Back</button>':'')+'<button class="primary" id="nxt">'+(st===5?'Start practice':'Next')+' \u203A</button></div>';
    h+='<p class="muted sm center" style="margin-top:12px">Step '+(st+1)+' of 9</p>';
  }else if(st===6||st===7){
    h+=practiceHTML();
    h+='<div class="lnav" style="margin-top:12px"><button class="ghost" id="prev">\u2039 Back</button></div>';
    h+='<p class="muted sm center" style="margin-top:12px">'+(st===6?'Guided practice':'Mix it up')+', step '+(st+1)+' of 9</p>';
  }else{
    h+=ch([['ch-title','Lesson 1 complete!'],['cw','You worked through doubles and triples.'],['cy','★ Stamp earned'],['cd','Come back anytime to practice. There is no rush.']],false);
    h+='<div class="lnav"><button class="primary" id="done">Back to the classroom</button></div>';
  }
  return h;
}
function checkQ(){
  var q=C.qs[C.qi],inp=$('#ans'),v=parseInt(inp.value,10);
  if(isNaN(v)){C.fb='Type a number first.';C.fbc='no';return;}
  C.val=inp.value;
  if(v===q.ans){C.done=true;C.fb='';C.val='';}
  else{C.attempts++;C.fbc='no';C.fb='Not quite. '+v+' is a bit '+(v>q.ans?'high':'low')+'. Try again.';}
}
function bindClass(){
  $('#back').onclick=function(){S.view='home';render();window.scrollTo(0,0);};
  var l1=$('#l1');if(l1)l1.onclick=function(){S.view='lesson';goStep(0);};
}
function bindLesson(){
  var q=function(s){return document.querySelector(s);};
  q('#back').onclick=function(){S.view='class';render();window.scrollTo(0,0);};
  var nx=q('#nxt');if(nx)nx.onclick=function(){goStep(C.step+1);};
  var pv=q('#prev');if(pv)pv.onclick=function(){goStep(C.step-1);};
  var al=q('#alt');if(al)al.onclick=function(){C.alt=!C.alt;render();};
  var ts=q('#tsize');if(ts)ts.onclick=function(){S.big=!S.big;saveS();render();};
  var dn=q('#done');if(dn)dn.onclick=function(){S.view='class';render();window.scrollTo(0,0);};
  var ck=q('#chk');if(ck)ck.onclick=function(){checkQ();render();};
  var ans=q('#ans');
  if(ans){ans.onkeydown=function(e){if(e.key==='Enter'){checkQ();render();}};try{ans.focus({preventScroll:true});ans.select();}catch(e){}}
  var hb=q('#hintbtn');if(hb)hb.onclick=function(){C.hints++;render();};
  var rv=q('#reveal');if(rv)rv.onclick=function(){C.done=true;C.fb='';C.val='';render();};
  var qn=q('#qnext');if(qn)qn.onclick=function(){
    if(C.qi<C.qs.length-1){C.qi++;C.attempts=0;C.hints=0;C.fb='';C.fbc='';C.done=false;C.val='';render();}
    else goStep(C.step+1);
  };
}

/* ---------- game flow ---------- */
function newGame(){
  var np=S.players;
  G={round:0,cur:0,players:[],attempts:0,hint:false,hintUsed:false,fb:'',fbc:'',lastVal:'',wrong:[],note:'',oppMsg:'',
     over:false,winner:-1,rules:{dIn:S.dIn,dOut:S.dOut},rewards:np===1,turnEarn:0,gameEarn:0,msgs:[]};
  for(var i=0;i<np;i++){
    var marks={};CR.forEach(function(n){marks[n]=0;});
    var nmv=np===2?((S.names[i]||'').trim()||'Player '+(i+1)):'You';
    G.players.push({name:nmv,rem:S.start,isIn:!S.dIn,marks:marks,score:0,q:0,ft:0,streak:0,best:0});
  }
  if(S.mode==='cricket'&&np===1)G.bot=new Set();
  startTurn(true);
}
function startTurn(first){
  if(first){G.cur=0;G.round=1;}
  else{G.cur=(G.cur+1)%G.players.length;if(G.cur===0)G.round++;}
  G.attempts=0;G.hint=false;G.hintUsed=false;G.fb='';G.fbc='';G.lastVal='';G.wrong=[];G.note='';G.oppMsg='';G.turnEarn=0;G.msgs=[];
  if(S.mode==='501'){G.turn=gen501(P());G.step='total';}
  else{G.turn=genCricket();G.step='marks';G.add={};CR.forEach(function(n){G.add[n]=0;});}
  render();
  window.scrollTo(0,0);
}
function toMenu(){G=null;S.view='home';render();window.scrollTo(0,0);}
function render(){
  var app=$('#app');
  if(!G){if(S.view==='opts'){app.innerHTML=optsHTML();bindOpts();}else if(S.view==='how'){app.innerHTML=howHTML();bindHow();}else if(S.view==='trophies'){app.innerHTML=trophiesHTML();bindTrophies();}else if(S.view==='class'){app.innerHTML=classHTML();bindClass();}else if(S.view==='lesson'){app.innerHTML=lessonHTML();bindLesson();}else{app.innerHTML=homeHTML();bindHome();}return;}
  var np=G.players.length;
  app.innerHTML='<div class="top"><button class="ghost" id="menu">Menu</button><div class="ttl">'+(S.mode==='501'?S.start:'Cricket')+'</div><div class="bank" id="bank"></div></div>'+
    '<div class="rules">'+rulesLine()+'</div>'+
    '<div class="hud'+(np===2?' two':'')+'" id="hud"></div>'+
    (np===2?'<div class="turn">'+esc(P().name)+'\'s turn</div>':'')+
    '<div class="boardbox">'+boardSVG(G.turn.darts)+'</div>'+
    '<div class="legend"><span>S = single</span><span>D = double (×2)</span><span>T = triple (×3)</span></div>'+
    '<div class="chips">'+chipsHTML(G.turn.darts)+'</div>'+
    '<div class="card" id="panel"></div>';
  $('#menu').onclick=toMenu;
  renderPanel();
}
function hud(){
  var np=G.players.length,is501=S.mode==='501';
  var h=G.players.map(function(p,i){
    var acc=p.q?Math.round(100*p.ft/p.q)+'%':'–';
    var big=is501?p.rem:p.score,lab=is501?'remaining':'points';
    var tag=(is501&&G.rules.dIn&&!p.isIn)?'<div class="tag">needs a double</div>':'';
    var name=np===2?'<div class="pn">'+esc(p.name)+'</div>':'';
    var sub='<div class="muted sm">'+lab+(np===2?', '+acc+' first try':'')+'</div>';
    return '<div class="pl'+(np===2&&i===G.cur?' on':'')+'">'+name+'<div class="big">'+big+'</div>'+sub+tag+'</div>';
  }).join('');
  if(np===1){
    var p=G.players[0],acc1=p.q?Math.round(100*p.ft/p.q)+'%':'–';
    h+='<div class="mini"><div><b>'+G.round+'</b><span>round</span></div><div><b>'+acc1+'</b><span>first try</span></div><div><b>'+p.streak+'</b><span>streak</span></div></div>';
  }
  $('#hud').innerHTML=h;
  var bk=$('#bank');if(bk)bk.innerHTML=G.rewards?bullSVG(18)+' '+R.bulls:'';
}
function resolve(good){
  var p=P(),first=good&&G.attempts===0&&!G.hintUsed;
  p.q++;
  if(first){p.ft++;p.streak++;p.best=Math.max(p.best,p.streak);}else p.streak=0;
  if(G.rewards)rewardAnswer(good,first,p);
  G.attempts=0;G.hint=false;G.hintUsed=false;G.fb='';G.fbc='';G.lastVal='';G.wrong=[];
}
function wrongAns(v,exp){
  G.attempts++;G.fbc='no';
  G.fb='Not quite. '+v+' is a bit '+(v>exp?'high':'low')+'. Try again.';
}
function inputRow(){
  return '<div class="row"><input id="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="?" aria-label="Your answer" value="'+esc(G.lastVal)+'"><button class="primary" id="chk">Check</button></div>';
}
function fbH(){return G.fb?'<div class="fb '+G.fbc+'">'+G.fb+'</div>':'';}
function helpH(txt){
  return '<div class="row2"><button class="ghost" id="hintbtn">'+(G.hint?'Hide hint':'Need a hint?')+'</button>'+(G.attempts>=2?'<button class="ghost" id="reveal">Show answer</button>':'')+'</div>'+(G.hint?'<div class="hint">'+txt+'</div>':'');
}
function summaryHTML(){
  return '<ul class="lines">'+G.players.map(function(p){
    var a=p.q?Math.round(100*p.ft/p.q)+'% right first try':'no answers yet';
    return '<li><b>'+esc(p.name)+'</b>: '+a+', best streak '+p.best+(S.mode==='cricket'?', '+p.score+' points':'')+'</li>';
  }).join('')+'</ul>';
}
function nextBtn(){
  var np=G.players.length;
  if(np===2)return '<button class="primary wide" id="next">Pass to '+esc(G.players[1-G.cur].name)+'</button>';
  return '<button class="primary wide" id="next">Next round</button>';
}
function overButtons(){return '<div class="row2"><button class="primary" id="again">Play again</button><button class="ghost" id="menu2">Menu</button></div>';}
function bustRules(){
  return G.rules.dOut
    ?'Bust rules: you can\'t go below 0, can\'t be left on 1, and must finish on a double. After a bust your score goes back to what it was.'
    :'Bust rule: going below 0 is a bust, and your score goes back to what it was. Land exactly on 0 to win.';
}

/* ---------- 501 panel ---------- */
function panel501(){
  var t=G.turn,p=P(),h='';
  if(G.note)h+='<div class="note ok">'+G.note+'</div>';
  if(G.step==='total'){
    h+='<p class="q">'+(t.startIn?'Add up the darts. What\'s the round total?':'You haven\'t doubled in yet, so only darts from your first double count. What\'s the round total?')+'</p>';
    h+=inputRow()+fbH()+helpH(t.darts.map(describe501).map(esc).join('<br>'));
  }else if(G.step==='score'){
    h+='<p class="q">You started this round on <b>'+t.startRem+'</b>. What\'s your score now?</p>';
    h+='<p class="muted sm">'+bustRules()+'</p>';
    h+=inputRow()+fbH()+helpH(t.startRem+' − '+t.total+' = ?<br>Then check the bust rules.');
  }else{
    var naive=t.startRem-t.total,ar;
    if(t.bust){
      var why=naive<0?t.startRem+' − '+t.total+' would go below zero.':naive===1?t.startRem+' − '+t.total+' would leave you on 1, and you can\'t finish from 1.':'That reaches 0, but the last dart wasn\'t a double.';
      ar='<div class="res bust">Bust. '+why+' Your score stays at '+t.startRem+'.</div>';
    }else if(!t.startIn&&t.total===0){
      ar='<div class="res">No double yet, so nothing counts. Still on <b>'+t.startRem+'</b>.</div>';
    }else{
      ar='<div class="res">'+(!t.startIn?'Doubled in! ':'')+t.startRem+' − '+t.total+' = <b>'+t.newScore+'</b></div>';
    }
    h+=ar;
    if(G.over){
      var how=G.rules.dOut?' on a double':'';
      h+='<div class="res win">'+(G.players.length===2?esc(p.name)+' wins! Checked out'+how+'.':'Checkout! You finished'+how+'.')+'</div>';
      h+=summaryHTML()+gameEarnHTML()+overButtons();
    }else h+=nextBtn();
  }
  return h;
}
function check501(){
  var inp=$('#ans'),v=parseInt(inp.value,10),t=G.turn;
  if(isNaN(v)){G.fb='Type a number first.';G.fbc='no';return;}
  G.lastVal=inp.value;
  if(G.step==='total'){
    if(v===t.total){resolve(true);G.step='score';G.note='Round total: '+t.total;}
    else wrongAns(v,t.total);
  }else{
    if(v===t.newScore){resolve(true);finish501();}
    else if(t.bust&&v===t.startRem-t.total){resolve(false);finish501();}
    else wrongAns(v,t.newScore);
  }
}
function finish501(){
  var t=G.turn,p=P();
  p.rem=t.newScore;p.isIn=t.newIn;G.step='done';G.note='';
  if(t.won){G.over=true;G.winner=G.cur;if(G.rewards)rewardGame();}
}

/* ---------- cricket panel ---------- */
function tilesHTML(locked){
  var p=P(),o=O();
  return '<div class="tiles">'+CR.map(function(n){
    var bad=G.wrong.indexOf(n)>=0,opp;
    if(o){var m=o.marks[n];opp='<div class="topp'+(m>=3?' cl':'')+'">opp '+GL[Math.min(3,m)]+'</div>';}
    else opp='<div class="topp cl">'+(G.bot.has(n)?'opp ⊗':'')+'</div>';
    return '<div class="tile'+(bad?' bad':'')+'"><div class="tnum">'+nm(n)+'</div><div class="tg">'+GL[Math.min(3,p.marks[n]+G.add[n])]+'</div>'+opp+
      (locked?'':'<button data-n="'+n+'" data-d="1" aria-label="Add a mark on '+nm(n)+'">+</button>')+
      '<div class="tadd">'+(p.marks[n]+G.add[n])+'</div>'+
      (locked?'':'<button data-n="'+n+'" data-d="-1" aria-label="Remove a mark on '+nm(n)+'">−</button>')+'</div>';
  }).join('')+'</div>';
}
function panelCR(){
  var t=G.turn,p=P(),h='';
  if(G.step==='marks'){
    h+='<p class="q">Add your new marks. Each counter starts at what you already have, so tap + for every mark these three darts earned.</p>'+tilesHTML(false);
    h+='<p class="muted sm">⊗ means closed (3 marks or more). Below each symbol is your opponent\'s; red means they\'ve closed it, so no points there.</p>';
    h+='<button class="primary wide" id="chk">Check marks</button>'+fbH()+helpH(t.darts.map(describeCR).map(esc).join('<br>'));
  }else if(G.step==='points'){
    h+=tilesHTML(true)+'<p class="q">How many points did this round score?</p>';
    h+='<p class="muted sm">Once a number is closed (3 marks), each extra mark scores its value, unless your opponent has closed it too. Bull is worth 25.</p>';
    var hl=t.detail.filter(function(d){return d.add>0;}).map(function(d){
      if(d.sc===0)return nm(d.n)+': you had '+d.before+', added '+d.add+'. No marks past three.';
      if(d.blocked)return nm(d.n)+': '+oppName()+' closed it, so no points.';
      return nm(d.n)+': '+d.sc+' scoring mark'+(d.sc>1?'s':'')+' × '+d.n+' = ?';
    });
    h+=inputRow()+fbH()+helpH(hl.length?hl.map(esc).join('<br>'):'No marks were added, so nothing to score.');
  }else{
    var lines=t.detail.filter(function(d){return d.add>0;}).map(function(d){
      if(d.sc>0&&d.blocked)return '<li>'+nm(d.n)+': '+esc(oppName())+' closed it, no points</li>';
      if(d.sc>0)return '<li>'+nm(d.n)+': '+d.sc+' extra × '+d.n+' = '+d.pts+'</li>';
      return '<li>'+nm(d.n)+': '+Math.min(3,d.before+d.add)+' of 3 marks</li>';
    }).join('');
    h+='<div class="res">Round score: <b>'+t.points+'</b></div>';
    if(lines)h+='<ul class="lines">'+lines+'</ul>';
    if(G.oppMsg)h+='<p class="muted sm">'+G.oppMsg+'</p>';
    if(G.over){
      if(G.players.length===1)h+='<div class="res win">All seven numbers closed!</div>';
      else if(G.winner>=0)h+='<div class="res win">'+esc(G.players[G.winner].name)+' wins!</div>';
      else h+='<div class="res">It\'s a tie!</div>';
      h+=summaryHTML()+gameEarnHTML()+overButtons();
    }else h+=nextBtn();
  }
  return h;
}
function checkCR(){
  var t=G.turn;
  if(G.step==='marks'){
    var bad=CR.filter(function(n){return G.add[n]!==t.exp[n];});
    if(!bad.length){resolve(true);G.step='points';}
    else{G.attempts++;G.fbc='no';G.fb='Not quite. Recount the marks for each dart.';if(G.attempts>=2)G.wrong=bad;}
  }else{
    var inp=$('#ans'),v=parseInt(inp.value,10);
    if(isNaN(v)){G.fb='Type a number first.';G.fbc='no';return;}
    G.lastVal=inp.value;
    if(v===t.points){resolve(true);finishCR();}
    else wrongAns(v,t.points);
  }
}
function finishCR(){
  var t=G.turn,p=P(),o=O();
  CR.forEach(function(n){p.marks[n]+=t.exp[n];});
  p.score+=t.points;G.oppMsg='';
  if(!o){
    if(G.round%3===0){
      var c=[15,16,17,18,19,20,25].filter(function(n){return !G.bot.has(n);});
      if(c.length){var n=c[0];G.bot.add(n);G.oppMsg='The opponent just closed '+nm(n)+'.';}
    }
    G.over=closedAll(p);if(G.over&&G.rewards)rewardGame();
  }else{
    if(closedAll(p)&&closedAll(o)){
      G.over=true;G.winner=p.score>o.score?G.cur:o.score>p.score?1-G.cur:-1;
    }else if(closedAll(p)&&p.score>=o.score){
      G.over=true;G.winner=G.cur;
    }
  }
  G.step='done';
}

/* ---------- shared panel wiring ---------- */
function reveal(){
  var t=G.turn;
  if(S.mode==='501'){
    if(G.step==='total'){resolve(false);G.step='score';G.note='Round total: '+t.total;}
    else{resolve(false);finish501();}
  }else{
    if(G.step==='marks'){CR.forEach(function(n){G.add[n]=t.exp[n];});resolve(false);G.step='points';}
    else{resolve(false);finishCR();}
  }
  renderPanel();
}
function onCheck(){
  if(S.mode==='501')check501();else checkCR();
  renderPanel();
}
function renderPanel(){
  hud();
  var p=$('#panel');
  p.innerHTML=earnHTML()+(S.mode==='501'?panel501():panelCR());
  var q=function(s){return p.querySelector(s);};
  var chk=q('#chk');if(chk)chk.onclick=onCheck;
  var ans=q('#ans');
  if(ans){ans.onkeydown=function(e){if(e.key==='Enter')onCheck();};try{ans.focus({preventScroll:true});ans.select();}catch(e){}}
  var hb=q('#hintbtn');if(hb)hb.onclick=function(){G.hint=!G.hint;if(G.hint)G.hintUsed=true;renderPanel();};
  var rv=q('#reveal');if(rv)rv.onclick=reveal;
  var nx=q('#next');if(nx)nx.onclick=function(){startTurn(false);};
  var ag=q('#again');if(ag)ag.onclick=newGame;
  var mn=q('#menu2');if(mn)mn.onclick=toMenu;
  var tb=p.querySelectorAll('.tile button');
  for(var i=0;i<tb.length;i++){(function(b){b.onclick=function(){
    var n=+b.dataset.n;G.add[n]=Math.max(0,Math.min(9,G.add[n]+(+b.dataset.d)));renderPanel();
  };})(tb[i]);}
}
render();
</script>
